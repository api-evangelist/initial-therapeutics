aid: initial-therapeutics
name: Initial Therapeutics
description: >-
  Initial Therapeutics, Inc. is a preclinical-stage biotechnology company in South San
  Francisco, California, discovering and developing a new class of small-molecule medicines
  designed to halt pathogenic protein formation in its earliest stages. Its proprietary STOPS
  platform — Selective Termination of Protein Synthesis — intercepts the translation of a target
  protein inside the exit tunnel of the ribosome, recognizing the nascent primary linear sequence
  rather than a fully folded three-dimensional structure, an approach the company positions as
  starkly differentiated from targeted protein degradation and from interventions that can only
  act on proteins after they are fully formed. The company launched publicly on May 1, 2023 with
  a $75 million Series A from Apple Tree Partners, was co-founded with academic scientists Jamie
  H. D. Cate (UC Berkeley), Brian Paegel (UC Irvine) and Kevan Shokat (UCSF/UC Berkeley), and
  builds on ribosome biochemistry, proteomics, medicinal chemistry, DNA-encoded library technology
  and chemical genetics, with early programs aimed at oncology targets long considered undruggable.
  Initial Therapeutics is a therapeutics discovery company, not a software vendor: it publishes a
  small marketing website and no public API, SDK, developer portal or machine-readable contract of
  any kind.
